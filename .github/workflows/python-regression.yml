name: Python Regression

on:
  push:
    branches: [main, "migration/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Provision verified Solidity compiler
        run: python -c "import solcx; solcx.install_solc('0.8.26'); assert '0.8.26' in {str(v) for v in solcx.get_installed_solc_versions()}"
      - run: python -m pytest
