name: CYDRA Web3 Authorization Specialist

on:
  push:
    branches: [main, "migration/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      program_url:
        description: "Exact bounty/program scope URL authorizing this target"
        required: true
        type: string
      target_repo:
        description: "Authorized target Git repository URL"
        required: true
        type: string
      target_ref:
        description: "Immutable target commit SHA (preferred) or pinned tag"
        required: true
        type: string
      target_path:
        description: "Target Solidity source path relative to target repository"
        required: true
        type: string
      target_project:
        description: "Target project directory relative to repository root (usually .)"
        required: true
        default: "."
        type: string
      require_ready:
        description: "Require causal verification and independent reproduction"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q

  blind-authorization-campaign:
    if: github.event_name == 'workflow_dispatch'
    needs: python-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Record scope and immutable target intake
        env:
          PROGRAM_URL: ${{ inputs.program_url }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ inputs.target_path }}
          TARGET_PROJECT: ${{ inputs.target_project }}
        run: |
          {
            echo "Program scope URL: $PROGRAM_URL"
            echo "Target repository: $TARGET_REPO"
            echo "Target revision: $TARGET_REF"
            echo "Target source path: $TARGET_PATH"
            echo "Target project path: $TARGET_PROJECT"
            echo "Execution: local source checkout and isolated Foundry tests only"
            echo "External transactions: not performed by this workflow"
          } | tee "$RUNNER_TEMP/target-intake.txt"
      - name: Validate campaign intake format
        env:
          PROGRAM_URL: ${{ inputs.program_url }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ inputs.target_path }}
          TARGET_PROJECT: ${{ inputs.target_project }}
        run: |
          python scripts/validate_campaign_intake.py \
            --program-url "$PROGRAM_URL" \
            --target-repo "$TARGET_REPO" \
            --target-ref "$TARGET_REF" \
            --target-path "$TARGET_PATH" \
            --target-project "$TARGET_PROJECT"
      - name: Run blind authorization campaign
        env:
          PYTHONPATH: src
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ inputs.target_path }}
          TARGET_PROJECT: ${{ inputs.target_project }}
          REQUIRE_READY: ${{ inputs.require_ready }}
        run: |
          set -o pipefail
          args=(
            --target-repo "$TARGET_REPO"
            --target-ref "$TARGET_REF"
            --target-path "$TARGET_PATH"
            --target-project "$TARGET_PROJECT"
            --output "$RUNNER_TEMP/authorization-campaign.json"
          )
          if [[ "$REQUIRE_READY" == "true" ]]; then
            args+=(--require-ready)
          fi
          python scripts/run_authorization_campaign.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/authorization-campaign.log"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web3-authorization-campaign
          path: |
            ${{ runner.temp }}/target-intake.txt
            ${{ runner.temp }}/authorization-campaign.json
            ${{ runner.temp }}/authorization-campaign.log
          if-no-files-found: warn
          retention-days: 14

  cow-authorization-fork-experiment:
    if: github.event_name == 'pull_request' && github.head_ref == 'experiment/cow-set-manager-fork'
    needs: python-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/cow-set-manager
    env:
      MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Select a reachable Ethereum mainnet RPC and pin a recent block
        shell: bash
        run: |
          set -euo pipefail
          candidates=("${MAINNET_RPC_URL:-}" "https://ethereum.publicnode.com" "https://eth.llamarpc.com" "https://rpc.ankr.com/eth" "https://eth.api.onfinality.io/public")
          for endpoint in "${candidates[@]}"; do
            [[ -n "$endpoint" ]] || continue
            chain_id=$(cast chain-id --rpc-url "$endpoint" 2>/dev/null || true)
            [[ "$chain_id" == "1" ]] || continue
            latest=$(cast block-number --rpc-url "$endpoint" 2>/dev/null || true)
            [[ "$latest" =~ ^[0-9]+$ ]] || continue
            pin=$((latest - 64))
            (( pin > 0 )) || continue
            cast block "$pin" --rpc-url "$endpoint" >/dev/null 2>&1 || continue
            {
              echo "MAINNET_RPC_URL=$endpoint"
              echo "FORK_BLOCK_NUMBER=$pin"
            } >> "$GITHUB_ENV"
            echo "Selected Ethereum mainnet RPC; pinned block $pin."
            exit 0
          done
          echo "No configured/public Ethereum RPC could serve a pinned block." >&2
          exit 1
      - name: Run setManager authorization control
        run: forge test --match-contract CoWSetManagerTest --fork-url "$MAINNET_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" -vvv 2>&1 | tee cow-set-manager-run.log
      - name: Run addSolver authorization control
        run: forge test --match-contract CoWAddSolverTest --fork-url "$MAINNET_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" -vvv 2>&1 | tee cow-add-solver-run.log
      - name: Run removeSolver authorization and isolation control
        run: forge test --match-contract CoWRemoveSolverTest --fork-url "$MAINNET_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" -vvv 2>&1 | tee cow-remove-solver-run.log
      - name: Run initializeManager replay control
        run: forge test --match-contract CoWInitializeManagerTest --fork-url "$MAINNET_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" -vvv 2>&1 | tee cow-initialize-manager-run.log
      - name: Run removed-solver settlement cross-function control
        run: forge test --match-contract CoWRemovedSolverSettlementTest --fork-url "$MAINNET_RPC_URL" --fork-block-number "$FORK_BLOCK_NUMBER" -vvv 2>&1 | tee cow-removed-solver-settlement-run.log
      - name: Upload fork experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cow-authorization-fork-evidence
          path: |
            experiments/cow-set-manager/cow-set-manager-evidence.json
            experiments/cow-set-manager/cow-add-solver-evidence.json
            experiments/cow-set-manager/cow-remove-solver-evidence.json
            experiments/cow-set-manager/cow-initialize-manager-evidence.json
            experiments/cow-set-manager/cow-removed-solver-settlement-evidence.json
            experiments/cow-set-manager/cow-set-manager-run.log
            experiments/cow-set-manager/cow-add-solver-run.log
            experiments/cow-set-manager/cow-remove-solver-run.log
            experiments/cow-set-manager/cow-initialize-manager-run.log
            experiments/cow-set-manager/cow-removed-solver-settlement-run.log
          if-no-files-found: warn
          retention-days: 14
