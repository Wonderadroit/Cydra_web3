name: CYDRA Web3 Authorization Specialist

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/*.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/*.yml"
  workflow_dispatch:
    inputs:
      program_url:
        description: "Exact bounty/program scope URL authorizing this target"
        required: true
        type: string
      target_repo:
        description: "Authorized target Git repository URL"
        required: true
        type: string
      target_ref:
        description: "Immutable target commit SHA (preferred) or pinned tag"
        required: true
        type: string
      target_path:
        description: "Target Solidity source path relative to target repository"
        required: true
        type: string
      target_project:
        description: "Target project directory relative to repository root (usually .)"
        required: true
        default: "."
        type: string
      require_ready:
        description: "Require causal verification and independent reproduction"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q -rs

  blind-authorization-campaign:
    if: github.event_name == 'workflow_dispatch'
    needs: python-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight direct-solc dependency ancestry
        env:
          DIRECT_SOLC_COMMIT: d2087426dfeb4963bf20f9b330decaf97a3419fe
        run: |
          # Fetch the dependency PR head so its commit is available for the ancestry check.
          git fetch --no-tags origin refs/pull/79/head:refs/remotes/origin/pr-79-head
          git cat-file -e "${DIRECT_SOLC_COMMIT}^{commit}"
          if ! git merge-base --is-ancestor "$DIRECT_SOLC_COMMIT" HEAD; then
            echo "::error::Verification HEAD does not contain direct-solc dependency $DIRECT_SOLC_COMMIT."
            echo "Do not run the target campaign until this dependency is merged into the verification branch."
            exit 1
          fi
          echo "DIRECT_SOLC_ANCESTRY=PASS commit=$DIRECT_SOLC_COMMIT head=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Set up pnpm for pinned target dependency materialization
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Verify pnpm availability
        run: pnpm --version
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Record scope and immutable target intake
        env:
          PROGRAM_URL: ${{ inputs.program_url }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ inputs.target_path }}
          TARGET_PROJECT: ${{ inputs.target_project }}
        run: |
          {
            echo "Program scope URL: $PROGRAM_URL"
            echo "Target repository: $TARGET_REPO"
            echo "Target revision: $TARGET_REF"
            echo "Target source path: $TARGET_PATH"
            echo "Target project path: $TARGET_PROJECT"
            echo "Execution: local source checkout and isolated Foundry tests only"
            echo "External transactions: not performed by this workflow"
          } | tee "$RUNNER_TEMP/target-intake.txt"
      - name: Validate campaign intake format
        env:
          PROGRAM_URL: ${{ inputs.program_url }}
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ inputs.target_path }}
          TARGET_PROJECT: ${{ inputs.target_project }}
        run: |
          python scripts/validate_campaign_intake.py \
            --program-url "$PROGRAM_URL" \
            --target-repo "$TARGET_REPO" \
            --target-ref "$TARGET_REF" \
            --target-path "$TARGET_PATH" \
            --target-project "$TARGET_PROJECT"
      - name: Run blind authorization campaign
        env:
          PYTHONPATH: src
          TARGET_REPO: ${{ inputs.target_repo }}
          TARGET_REF: ${{ inputs.target_ref }}
          TARGET_PATH: ${{ inputs.target_path }}
          TARGET_PROJECT: ${{ inputs.target_project }}
          REQUIRE_READY: ${{ inputs.require_ready }}
          CYDRA_SOLC_DIAGNOSTIC_DIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          args=(
            --target-repo "$TARGET_REPO"
            --target-ref "$TARGET_REF"
            --target-path "$TARGET_PATH"
            --target-project "$TARGET_PROJECT"
            --output "$RUNNER_TEMP/authorization-campaign.json"
          )
          if [[ "$REQUIRE_READY" == "true" ]]; then
            args+=(--require-ready)
          fi
          python scripts/run_authorization_campaign.py "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/authorization-campaign.log"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web3-authorization-campaign
          path: |
            ${{ runner.temp }}/target-intake.txt
            ${{ runner.temp }}/authorization-campaign.json
            ${{ runner.temp }}/authorization-campaign.log
            ${{ runner.temp }}/generated-tests/
            ${{ runner.temp }}/solc-input-keys.json
            ${{ runner.temp }}/solc-errors.json
          if-no-files-found: warn
          retention-days: 14
