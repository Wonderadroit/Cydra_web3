name: CYDRA held-out CoW authentication Hardhat AST replay

on:
  push:
    branches: ["campaigns/cow-authentication-hardhat-ast"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held-out-authorization-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Validate pinned campaign intake
        run: |
          python scripts/validate_campaign_intake.py \
            --program-url "https://immunefi.com/bug-bounty/cowprotocol/scope/" \
            --target-repo "https://github.com/cowprotocol/contracts" \
            --target-ref "6ebbd810ff2da635fb6f88e9a15fde196f8c852a" \
            --target-path "src/contracts/GPv2AllowListAuthentication.sol" \
            --target-project "."
      - name: Run blind campaign against scope-pinned authentication source
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_authorization_campaign.py \
            --target-repo "https://github.com/cowprotocol/contracts" \
            --target-ref "6ebbd810ff2da635fb6f88e9a15fde196f8c852a" \
            --target-path "src/contracts/GPv2AllowListAuthentication.sol" \
            --target-project "." \
            --allow-no-hypothesis \
            --require-ready \
            --output "$RUNNER_TEMP/authorization-campaign.json" 2>&1 | tee "$RUNNER_TEMP/authorization-campaign.log"
      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-heldout-cow-authentication-hardhat-ast
          path: |
            ${{ runner.temp }}/authorization-campaign.json
            ${{ runner.temp }}/authorization-campaign.log
          if-no-files-found: warn
          retention-days: 30
