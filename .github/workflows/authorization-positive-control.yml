name: Authorization Positive Control

on:
  push:
    branches:
      - "campaign/authorization-positive-control-*"
      - "fix/compiler-closure-inherited-scope"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-positive-control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Record historical-control provenance
        run: |
          {
            echo "Control type: historical public positive control; not a novel finding"
            echo "Public report: https://github.com/code-423n4/2024-01-decent-findings/issues/465"
            echo "Target repository: https://github.com/decentxyz/decent-bridge"
            echo "Target commit: 7f90fd4489551b69c20d11eeecb17a3f564afb18"
            echo "Target source: src/DcntEth.sol"
            echo "Execution: local-only isolated Foundry tests; no live transactions"
          } | tee "$RUNNER_TEMP/control-intake.txt"
      - name: Run blind positive control with causal and reproduction gates
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_authorization_campaign.py             --target-repo https://github.com/decentxyz/decent-bridge.git             --target-ref 7f90fd4489551b69c20d11eeecb17a3f564afb18             --target-path src/DcntEth.sol             --target-project .             --require-ready             --output "$RUNNER_TEMP/authorization-positive-control.json"             2>&1 | tee "$RUNNER_TEMP/authorization-positive-control.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web3-authorization-positive-control
          path: |
            ${{ runner.temp }}/control-intake.txt
            ${{ runner.temp }}/authorization-positive-control.json
            ${{ runner.temp }}/authorization-positive-control.log
          if-no-files-found: warn
          retention-days: 14

  pinned-0x-measurement:
    needs: historical-positive-control
    if: needs.historical-positive-control.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Measure pinned 0x inherited execution surfaces without requiring finding readiness
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_authorization_campaign.py \
            --target-repo https://github.com/0xProject/0x-settler.git \
            --target-ref 3bda07a47858031165f28393dffb4a72aa861e56 \
            --target-path src/chains/Mainnet/TakerSubmitted.sol \
            --target-project . \
            --allow-no-hypothesis \
            --output "$RUNNER_TEMP/0x-authorization-campaign.json" \
            2>&1 | tee "$RUNNER_TEMP/0x-authorization-campaign.log"
      - name: Upload 0x measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web3-0x-authorization-measurement
          path: |
            ${{ runner.temp }}/0x-authorization-campaign.json
            ${{ runner.temp }}/0x-authorization-campaign.log
          if-no-files-found: warn
          retention-days: 14
