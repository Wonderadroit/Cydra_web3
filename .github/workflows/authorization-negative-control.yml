name: Authorization Negative Control

on:
  push:
    branches:
      - "campaign/authorization-negative-control-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Run protected authorization negative control
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_authorization_negative_control.py 2>&1 | tee "$RUNNER_TEMP/authorization-negative-control.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-web3-authorization-negative-control
          path: ${{ runner.temp }}/authorization-negative-control.log
          if-no-files-found: warn
          retention-days: 14
