name: CYDRA Authorization Corpus

on:
  push:
    branches: ["fix/campaign-evidence-finally"]
    paths:
      - "scripts/run_authorization_corpus.py"
      - "scripts/run_authorization_campaign.py"
      - "src/cydra/blind_authorization.py"
      - "src/cydra/authorization_runtime.py"
      - ".github/workflows/authorization-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-case-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - name: Run guarded, unguarded, and pinned Virtuals cases
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_authorization_corpus.py \
            --score-output "$RUNNER_TEMP/authorization-corpus-score.json" \
            | tee "$RUNNER_TEMP/authorization-corpus-score.log"
      - name: Upload the single score file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cydra-authorization-corpus-score
          path: ${{ runner.temp }}/authorization-corpus-score.json
          if-no-files-found: error
          retention-days: 30
