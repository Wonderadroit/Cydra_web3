[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cydra-web3"
version = "0.1.0"
description = "Evidence-first Solidity authorization vulnerability research specialist"
requires-python = ">=3.10"
dependencies = ["py-solc-x>=2.0.3,<3", "semantic-version>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
